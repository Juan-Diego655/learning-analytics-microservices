# Placeholder nginx config for la-ingestion
# Se reemplaza por configuración real (nginx + php-fpm) cuando se cree el proyecto Laravel.

server {
    listen 80;
    server_name la-ingestion;

    # Health check - responde 200 con JSON inline (sin dependencia de archivo)
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"la-ingestion","note":"placeholder de infraestructura"}';
    }

    # Cualquier otra ruta devuelve un mensaje de placeholder
    location / {
        default_type application/json;
        return 200 '{"service":"la-ingestion","status":"placeholder","next_step":"reemplazar por Laravel"}';
    }
}
